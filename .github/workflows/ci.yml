name: Task API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: task_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d task_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/task_api_test
      JWT_SECRET: ci-test-secret-only
      NODE_ENV: test

    steps:
      - name: Debug package lock
        run: |
          pwd
          ls -la
          echo "GitHub workspace: $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE"
          node -e "const fs = require('fs'); console.log('Current directory:', process.cwd()); console.log('package.json exists:', fs.existsSync('package.json')); console.log('Lockfile exists:', fs.existsSync('package-lock.json'))"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test -- --run

      - name: Build TypeScript
        run: npm run build
